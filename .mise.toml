# mise configuration for WoW Emulation Rust projects
# https://mise.jdx.dev/configuration.html

[tools]
# ── Toolchain ──────────────────────────────────
rust = "stable"
node = "24"

# ── Build tools ────────────────────────────────
"cargo:cross" = "latest"
"cargo:cargo-binstall" = "latest"
"cargo:wasm-pack" = "latest"

# ── Testing and coverage ──────────────────────
"cargo:cargo-nextest" = "latest"
"cargo:cargo-llvm-cov" = "latest"

# ── Linting and auditing ─────────────────────
"cargo:cargo-deny" = "latest"
"cargo:https://github.com/akiomik/mado" = { version = "tag:v0.4.0", crate = "mado", bin = "mado" }
jactionlint = "latest"

# ── Documentation ─────────────────────────────
"cargo:mdbook" = "latest"
"cargo:mdbook-mermaid" = "latest"

# ── Profiling ─────────────────────────────────
"cargo:flamegraph" = "latest"
"cargo:inferno" = "latest"
